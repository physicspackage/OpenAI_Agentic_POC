[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dental-agent-poc"
version = "0.1.0"
description = "Dental office AI agent POC using OpenAI Agents SDK + Responses API"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.55.0",
  "openai-agents>=0.0.17",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.6",
  "httpx>=0.27.2",
  "pydantic>=2.9.2",
  "python-dotenv>=1.0.1",
  "rich>=13.9.2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
